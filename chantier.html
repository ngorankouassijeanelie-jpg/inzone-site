<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>inZONE — Site en chantier</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="description" content="inZONE, intelligence foncière industrielle. Site en chantier — accès test à l'application." />
<style>
*{box-sizing:border-box}body{margin:0;background:#070b0a;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{max-width:560px;width:100%;text-align:center;background:#0e1312;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:clamp(28px,5vw,56px)}
.logo{font-size:34px;font-weight:800;letter-spacing:-.04em}.logo small{display:block;font-size:11px;font-weight:500;color:#a8a29e;margin-top:6px}
.badge{display:inline-block;margin:20px 0 14px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#070b0a;background:#fff;border-radius:999px;padding:8px 16px}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.03em;line-height:1.05}
p{color:rgba(255,255,255,.7);font-size:15px}
.cta{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:15px 26px;font-size:15px;font-weight:700;text-decoration:none;border:1px solid #fff}
.btn-solid{background:#fff;color:#070b0a}.btn-ghost{background:transparent;color:#fff}
.btn:hover{transform:translateY(-1px)}
.meta{margin-top:22px;font-size:12px;color:rgba(255,255,255,.45)}
.meta a{color:#fff}
</style>
</head>
<body>
<main class="card">
  <div class="logo">inZONE<small>un service d'Africand Consulting</small></div>
  <span class="badge">Version test — chantier</span>
  <h1>Le site est en chantier.</h1>
  <p>L'application test reste accessible : explorez l'espace client avec les données de démonstration.</p>
  <div class="cta">
    <a class="btn btn-solid" href="inzone-espace-client.html">Entrer dans l'app →</a>
    <a class="btn btn-ghost" href="index.html">Voir le landing test</a>
  </div>
  <p class="meta">Contact : <a href="mailto:contact@africand.com">contact@africand.com</a></p>
</main>
</body>
</html>
